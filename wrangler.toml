name = "caitlin-stremio-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Run `npm run setup` once to create and bind these free KV namespaces.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_KV_ID"


[vars]
WORKER_ID = "caitlin-stremio-proxy"
# Set ORIGIN_URL and SHARED_SECRET with `wrangler secret put`.
